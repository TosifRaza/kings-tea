  <g fill="none" stroke="#fff4dc" stroke-width="4" stroke-linecap="round" opacity=".55"><path d="M143 876 Q127 850 148 831 Q161 817 151 795"/><path d="M181 876 Q166 851 186 832 Q199 815 188 791"/></g>
