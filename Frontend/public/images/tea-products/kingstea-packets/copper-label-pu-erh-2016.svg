    <path d="M328 550 H572" stroke="url(#foil)" stroke-width="2.5"/>
    <text x="450" y="581" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" letter-spacing="3.4" fill="#f5e4b1">PURE TEA · TIMELESS TASTE</text>
    <text text-anchor="middle" font-family="Georgia,serif" font-size="44" font-weight="bold" fill="#fff4d9"><tspan x="450" y="590">Copper Label Pu-erh</tspan><tspan x="450" y="636">2016</tspan></text>
    <text x="450" y="685" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" letter-spacing="3" fill="#eed999">PU-ERH TEA</text>
    <path d="M327 728 H573" stroke="url(#foil)" stroke-width="2" opacity=".88"/>
    <text x="450" y="763" text-anchor="middle" font-family="Georgia,serif" font-size="17" fill="#fff4d9">warm  ·  mellow  ·  rounded</text>
