<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1100" viewBox="0 0 900 1100" role="img" aria-labelledby="title desc">
  <title id="title">King's Tea Copper Label Pu-erh 2016 premium tea packet</title>
  <desc id="desc">A pu-erh tea packet in a scenic mountain tea garden, made for Copper Label Pu-erh 2016.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#e9c99f"/><stop offset=".45" stop-color="#f6dfba"/><stop offset="1" stop-color="#a5b58a"/></linearGradient>
    <linearGradient id="hills" x2="0" y2="1"><stop stop-color="#61795a"/><stop offset="1" stop-color="#183d2d"/></linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#123a3e"/><stop offset=".5" stop-color="#3a7970"/><stop offset="1" stop-color="#123a3e"/></linearGradient>
    <linearGradient id="foil" x2="1"><stop stop-color="#ae8541"/><stop offset=".5" stop-color="#f0d993"/><stop offset="1" stop-color="#a57a34"/></linearGradient>
    <linearGradient id="wood" x2="0" y2="1"><stop stop-color="#684323"/><stop offset=".35" stop-color="#9b6636"/><stop offset="1" stop-color="#3d281b"/></linearGradient>
    <linearGradient id="tea" x2="0" y2="1"><stop stop-color="#ffbf54"/><stop offset="1" stop-color="#8e3515"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="160%"><feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#10271d" flood-opacity=".42"/></filter>
    <filter id="cupShadow" x="-40%" y="-40%" width="180%" height="190%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#20170e" flood-opacity=".5"/></filter>
    <pattern id="grain" width="38" height="34" patternUnits="userSpaceOnUse"><path d="M0 8h38M0 27h38" stroke="#fff" stroke-opacity=".045"/><circle cx="9" cy="17" r="1.3" fill="#fff" fill-opacity=".1"/></pattern>
  </defs>

  <!-- A shared tea-garden setting keeps every product thumbnail in one family. -->
  <rect width="900" height="1100" fill="url(#sky)"/>
  <circle cx="738" cy="164" r="66" fill="#fff1bd" opacity=".86" filter="url(#soft)"/>
  <circle cx="738" cy="164" r="32" fill="#fff0bd" opacity=".9"/>
  <path d="M0 378 Q132 260 266 334 T530 307 T900 332 V700 H0Z" fill="#8b9b7a" opacity=".62" filter="url(#soft)"/>
  <path d="M0 435 Q153 292 306 401 Q424 291 574 390 Q708 281 900 399 V760 H0Z" fill="#718768" opacity=".76"/>
  <path d="M0 500 Q162 366 328 468 Q489 354 640 458 Q774 366 900 454 V810 H0Z" fill="url(#hills)"/>
  <g fill="none" stroke="#9eaa72" stroke-width="12" opacity=".46">
    <path d="M-40 558 Q125 446 310 535 T680 510 T950 530"/><path d="M-40 617 Q135 504 320 595 T680 570 T950 590"/>
    <path d="M-40 681 Q135 568 320 659 T680 634 T950 654"/>
