  <g fill="#3f7442" opacity=".8"><circle cx="18" cy="536" r="66"/><circle cx="875" cy="546" r="72"/><circle cx="84" cy="620" r="58"/><circle cx="828" cy="630" r="64"/></g>

  <!-- Rustic tasting table and loose tea establish the same product-photo framing. -->
  <path d="M0 805 Q450 770 900 805 V1100 H0Z" fill="url(#wood)"/>
  <path d="M0 840 Q450 808 900 840 M0 912 Q450 880 900 912 M0 1000 Q450 970 900 1000" fill="none" stroke="#d19a57" stroke-width="5" opacity=".32"/>
  <path d="M28 811 Q72 778 105 817 Q71 844 28 811 M855 818 Q814 779 778 817 Q817 847 855 818" fill="#315a32" stroke="#b18a42" stroke-width="2"/>
  <g fill="#261a12" opacity=".95">
    <ellipse cx="747" cy="1000" rx="83" ry="30"/><ellipse cx="714" cy="1014" rx="54" ry="17"/>
    <path d="M690 991q-14-30 7-28t11 34q18-38 30-22t-12 37q35-29 41-9t-43 25q-35 7-34-37Z"/>
    <path d="M771 1002q-8-35 9-32t9 39q21-31 31-15t-21 30q36-20 38-2t-42 18Z"/>
  </g>

  <!-- Product pouch: identical silhouette and label layout, with a product-specific color. -->
  <g filter="url(#shadow)">
    <path d="M229 288 Q238 265 273 265 H627 Q662 265 671 288 L693 346 L682 843 Q680 874 650 885 Q450 906 250 885 Q220 874 218 843 L207 346 Z" fill="url(#pouch)" stroke="url(#foil)" stroke-width="6"/>
