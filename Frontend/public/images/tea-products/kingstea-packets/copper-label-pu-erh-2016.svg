    <path d="M260 915 Q302 910 301 942 Q299 971 248 969" fill="none" stroke="#ffe3a5" stroke-width="8"/>
    <ellipse cx="172" cy="906" rx="72" ry="10" fill="#fff0cc" fill-opacity=".75" stroke="#fff0cc" stroke-width="3"/>
